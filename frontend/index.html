<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f7a4d">
  <title>EcoAbidjan</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♻️</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">♻</span> EcoAbidjan</div>
    <div id="userbox" class="userbox"></div>
  </header>
  <nav id="nav" class="nav" hidden></nav>
  <main id="view" class="container"></main>
  <div id="toast" class="toast" hidden></div>

  <button id="chat-fab" class="chat-fab" aria-label="Ouvrir l'assistant Eco" title="Assistant Eco">💬<span class="chat-fab-label">Eco</span></button>
  <section id="chat" class="chat" hidden aria-label="Assistant Eco">
    <header class="chat-head">
      <div class="chat-avatar">♻</div>
      <div class="chat-title"><strong>Eco</strong><span id="chat-engine" class="small">Assistant EcoAbidjan</span></div>
      <button id="chat-tts" class="chat-icon" aria-pressed="false" title="Lire les reponses a voix haute" aria-label="Lecture vocale">🔈</button>
      <button id="chat-reset" class="chat-icon" title="Nouvelle conversation" aria-label="Nouvelle conversation">↺</button>
      <button id="chat-close" class="chat-icon" title="Fermer" aria-label="Fermer">✕</button>
    </header>
    <div id="chat-log" class="chat-log" aria-live="polite"></div>
    <div id="chat-suggest" class="chat-suggest"></div>
    <form id="chat-form" class="chat-form">
      <button type="button" id="chat-mic" class="chat-icon" title="Parler" aria-label="Dicter un message">🎤</button>
      <input id="chat-input" autocomplete="off" maxlength="1000" placeholder="Ecris ta question…" aria-label="Message">
      <button class="chat-send" aria-label="Envoyer">➤</button>
    </form>
  </section>
  <div id="modal" class="modal" hidden>
    <form class="modal-card" id="modal-form">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div class="actions">
        <button type="button" class="btn ghost" id="modal-cancel">Annuler</button>
        <button type="submit" class="btn">Valider</button>
      </div>
    </form>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
